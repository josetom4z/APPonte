<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="45%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="needleLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ecfdf5" />
    </linearGradient>
    <linearGradient id="needleDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#044e3a" />
      <stop offset="100%" stop-color="#062e24" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#064e3b" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="120" fill="url(#brandGrad)" />

  <!-- Outer Dial Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" opacity="0.92" filter="url(#glow)" />

  <!-- Cardinal Tick Marks -->
  <line x1="256" y1="72" x2="256" y2="102" stroke="#ffffff" stroke-width="20" stroke-linecap="round" />
  <line x1="256" y1="410" x2="256" y2="440" stroke="#ffffff" stroke-width="16" stroke-linecap="round" opacity="0.8" />
  <line x1="72" y1="256" x2="102" y2="256" stroke="#ffffff" stroke-width="16" stroke-linecap="round" opacity="0.8" />
  <line x1="410" y1="256" x2="440" y2="256" stroke="#ffffff" stroke-width="20" stroke-linecap="round" />

  <!-- Dynamic Compass Needle (Top-Right / Future Orientation) -->
  <!-- North / Glowing Arrow (Points to Top-Right 45 deg) -->
  <polygon points="256,256 220,236 360,152 276,292" fill="url(#needleLight)" filter="url(#glow)" />
  
  <!-- South Needle (Dark Accent) -->
  <polygon points="256,256 292,276 152,360 236,220" fill="url(#needleDark)" opacity="0.85" />

  <!-- Center Pivot Base and Pin -->
  <circle cx="256" cy="256" r="28" fill="#ffffff" filter="url(#glow)" />
  <circle cx="256" cy="256" r="16" fill="#059669" />
  <circle cx="256" cy="256" r="6" fill="#ffffff" />
</svg>

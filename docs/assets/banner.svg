<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="bgCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>

    <!-- Brand Gradients -->
    <linearGradient id="emeraldTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="cyanText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Ambient Glows -->
    <radialGradient id="radialGlow1" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="radialGlow2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#0891b2" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0" />
    </radialGradient>

    <!-- Filters -->
    <filter id="shadowHeavy" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.55" />
    </filter>
    <filter id="shadowSubtle" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="480" rx="16" fill="url(#bgCanvas)" />
  <rect width="1200" height="480" fill="url(#radialGlow1)" />
  <rect width="1200" height="480" fill="url(#radialGlow2)" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="480" />
    <line x1="200" y1="0" x2="200" y2="480" />
    <line x1="300" y1="0" x2="300" y2="480" />
    <line x1="400" y1="0" x2="400" y2="480" />
    <line x1="500" y1="0" x2="500" y2="480" />
    <line x1="600" y1="0" x2="600" y2="480" />
    <line x1="700" y1="0" x2="700" y2="480" />
    <line x1="800" y1="0" x2="800" y2="480" />
    <line x1="900" y1="0" x2="900" y2="480" />
    <line x1="1000" y1="0" x2="1000" y2="480" />
    <line x1="1100" y1="0" x2="1100" y2="480" />

    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="0" y1="400" x2="1200" y2="400" />
  </g>

  <!-- Decorative Outer Border -->
  <rect x="1" y="1" width="1198" height="478" rx="15" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.6" />

  <!-- Content Group -->
  <g transform="translate(80, 68)">
    
    <!-- Top Subheading / Brand Meta -->
    <g transform="translate(0, 0)">
      <rect width="210" height="32" rx="16" fill="#042f2e" stroke="#10b981" stroke-width="1" opacity="0.9" />
      <circle cx="16" cy="16" r="5" fill="#10b981" />
      <text x="32" y="21" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">PIXELLAB GOVTECH</text>
    </g>

    <!-- Main Title Group -->
    <g transform="translate(0, 72)">
      <text x="0" y="0" fill="url(#cyanText)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="58" font-weight="800" letter-spacing="-1">APPONTE</text>
      
      <!-- Tagline -->
      <text x="0" y="42" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="19" font-weight="400">
        Plataforma de Participação Cidadã, Gestão Municipal &amp; Zeladoria Urbana
      </text>
      <text x="0" y="70" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="14.5" font-weight="400">
        Conectando munícipes, secretarias públicas e lideranças através de dados georreferenciados em tempo real.
      </text>
    </g>

    <!-- Feature Badges (Organized 2x2 Grid with plenty of clearance) -->
    <g transform="translate(0, 182)">
      <!-- Row 1 -->
      <g transform="translate(0, 0)">
        <!-- Badge 1: Mapas -->
        <g transform="translate(0, 0)">
          <rect width="180" height="38" rx="19" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1" filter="url(#shadowSubtle)" />
          <text x="18" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="13" font-weight="600">🗺️ Mapas Urbanos</text>
        </g>

        <!-- Badge 2: Multi-Tenant -->
        <g transform="translate(198, 0)">
          <rect width="185" height="38" rx="19" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1" filter="url(#shadowSubtle)" />
          <text x="18" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="13" font-weight="600">🏛️ Multi-Prefeitura</text>
        </g>
      </g>

      <!-- Row 2 -->
      <g transform="translate(0, 48)">
        <!-- Badge 3: SLAs -->
        <g transform="translate(0, 0)">
          <rect width="180" height="38" rx="19" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1" filter="url(#shadowSubtle)" />
          <text x="18" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="13" font-weight="600">⚡ SLA &amp; Dashboards</text>
        </g>

        <!-- Badge 4: PWA / Mobile & Dark Mode -->
        <g transform="translate(198, 0)">
          <rect width="185" height="38" rx="19" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1" filter="url(#shadowSubtle)" />
          <text x="18" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="13" font-weight="600">🌙 Dark Mode &amp; PWA</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Hero Logo Illustration on Right Side -->
  <g transform="translate(980, 240)" filter="url(#shadowHeavy)">
    <!-- Outer Dotted Ring -->
    <circle cx="0" cy="0" r="130" fill="none" stroke="#10b981" stroke-width="2" opacity="0.35" stroke-dasharray="8 8" />
    
    <!-- Inner Accent Ring -->
    <circle cx="0" cy="0" r="110" fill="none" stroke="#06b6d4" stroke-width="2.5" opacity="0.4" />

    <!-- Brand Squircle Logo -->
    <rect x="-80" y="-80" width="160" height="160" rx="40" fill="url(#emeraldTeal)" />

    <!-- Compass Dial in Squircle -->
    <circle cx="0" cy="0" r="50" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.9" />
    
    <!-- Cardinal Dots -->
    <circle cx="0" cy="-26" r="3.5" fill="#ffffff" />
    <circle cx="0" cy="26" r="3.5" fill="#ffffff" />
    <circle cx="-26" cy="0" r="3.5" fill="#ffffff" />
    <circle cx="26" cy="0" r="3.5" fill="#ffffff" />

    <!-- Compass Needles -->
    <polygon points="0,0 -11,-6 33,-33 6,11" fill="#ffffff" />
    <polygon points="0,0 11,6 -33,33 -6,-11" fill="#044e3a" opacity="0.9" />

    <!-- Center Pivot -->
    <circle cx="0" cy="0" r="8" fill="#ffffff" />
    <circle cx="0" cy="0" r="3.5" fill="#059669" />
  </g>
</svg>
